name: Günlük sayı

on:
  schedule:
    # 05:00 UTC = 08:00 TR. Asıl tetikleyici.
    - cron: "0 5 * * *"
    # YEDEKLER. GitHub Actions cron'u garanti değil: 31 Ağustos 2026'da
    # 05:00 tetikleyicisi hiç çalışmadı (workflow active, dosya main'de,
    # yine de tetiklenmedi). Yoğunlukta gecikiyor ya da atlanıyor.
    # Bu koşular --skip-if-done ile başlar; sayı zaten hazırsa saniyeler
    # içinde hiçbir maliyet çıkarmadan biter.
    - cron: "30 6 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Eşzamanlı bir koşu bu arada commit atmış olabilir. Çalışma ağacı
      # temizken çekmek çakışmasız; üretimden SONRA çekmek docs/ üzerinde
      # çakışıyordu ve push döngüsü kilitleniyordu.
      - name: Son hâli al
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: uv kur
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Bağımlılıklar
        run: uv sync --frozen

      - name: Testler
        run: uv run pytest -q

      # PROJECT.md §9: "Hata olursa iş başarısız olsun ama kısmi sonuç varsa
      # yine de commit et." Bu yüzden toplama adımı hatayı yutar, sonucu
      # kaydeder; iş en sonda başarısız edilir.
      - name: Kaynakları topla
        id: collect
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          TWITTERAPI_KEY: ${{ secrets.TWITTERAPI_KEY }}
        # Zamanlanmış koşular sayı zaten hazırsa hemen çıkar; elle
        # tetiklenen koşular her zaman yeniden üretir.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            uv run python -m pipeline.collect --skip-if-done
          else
            uv run python -m pipeline.collect
          fi

      - name: Sayfaları üret
        id: build
        continue-on-error: true
        run: uv run python -m sitegen.build

      - name: Commit ve push
        run: |
          git add docs/ data/digest.db
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          COUNT=$(uv run python -c "
          from pipeline.db import connect, digest_dates, digest_items
          c = connect(); d = digest_dates(c)
          print(len(digest_items(c, d[0])) if d else 0)
          " 2>/dev/null || echo "?")
          git commit -m "Sayı: $(date -u +%Y-%m-%d) — ${COUNT} madde"
          # Eşzamanlı bir push olursa yeniden dene. docs/ ve data/digest.db
          # her koşuda sıfırdan üretiliyor, dolayısıyla çakışmada DAİMA bu
          # koşunun ürettiği sürüm doğrudur: -X theirs (rebase'de "replay
          # edilen commit", yani bizimki). Takılı kalan rebase temizlenir.
          for i in 1 2 3; do
            git push && exit 0
            echo "push denemesi $i başarısız, yeniden tabanlanıyor"
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || {
              git rebase --abort 2>/dev/null || true
              sleep 5
              continue
            }
          done
          exit 1

      - name: Adım sonuçlarını doğrula
        if: steps.collect.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "toplama: ${{ steps.collect.outcome }}"
          echo "üretim : ${{ steps.build.outcome }}"
          echo "Kısmi sonuç commit'lendi ama bir adım başarısız oldu."
          exit 1
