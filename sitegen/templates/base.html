<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Gündem{% endblock %}</title>
<meta name="description" content="Her sabah developer tools, indie oyun, yeni uygulama ve tasarım dünyasından yeni çıkanlar — Türkçe özetlerle.">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="{{ canonical }}">
<style>{{ css|safe }}</style>
</head>
<body>
<div class="wrap">

<header class="masthead">

{% block content %}{% endblock %}

<footer>
  <a href="./">Bugünkü sayı</a> · <a href="arsiv.html">Arşiv</a><br>
  {{ generated_at }} · Hacker News, GitHub, Product Hunt, itch.io, Steam, Bluesky, X, RSS
