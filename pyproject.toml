[project]
name = "daily-launch"
version = "0.1.0"
description = "Günlük ürün & girişim gazetesi — toplar, özetler, statik sayfa üretir"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rapidfuzz>=3.9",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
