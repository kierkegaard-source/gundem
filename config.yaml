# Daily Launch — Faz 0 ölçümleriyle doğrulanmış yapılandırma (2026-08-30)
# Ölçüm detayları: FAZ0-RAPOR.md

budget:
  daily_llm_usd: 0.20
  daily_twitter_reads: 1400  # 64 hesap × 20 tweet (sayfa boyutu sabit) = 1280/gün

filters:
  max_per_category: 15
  max_total: 60
  # Kaynak başına tavan. Sıra yüzdeliği normalizasyonu kaynak içinde adil
  # sıralama verir ama hacmi ödüllendirir; tavan olmadan 197 maddelik Bluesky
  # ile 141 maddelik Twitter sayıyı ele geçirip Steam/itch.io'yu siliyordu.
  max_per_source: 10
  min_signal: 2
  lookback_hours: 26          # cron kaymalarına tolerans
  # FAZ 4: filtreleme özetlemeden önce çalıştığı için kategori kotasını düşük
  # sinyalli maddeler kapıyordu (gamedev 15 → signal filtresinden sonra 4).
  # Kotadan bu katsayı kadar fazla aday özetlenir, eleme sonrası tavan
  # yeniden uygulanır. Maliyeti ~%50 artırır (~$0.035 → ~$0.052/gün).
  summarize_oversample: 1.5

scoring:
  multi_source_bonus: 1.4
  recency:
    "0-6": 1.0
    "6-12": 0.9
    "12-24": 0.8
    "24+": 0.5

sources:
  hackernews:
    enabled: true
    weight: 0.9
    # ÖLÇÜM: "Show HN" min 10 puanla son 24s → 6 kayıt.
    # "Launch HN" aynı eşikle 0 kayıt (7 günde 18 var ama puanları düşük).
    # Bu yüzden sorgu başına ayrı eşik.
    queries:
      - { q: "Show HN",   min_points: 10 }
      - { q: "Launch HN", min_points: 0 }

  github_trending:
    enabled: true
    weight: 0.7
    min_stars_today: 50       # ÖLÇÜM: 19 repodan 17'si geçiyor
    since: daily

  producthunt:
    enabled: true             # PRODUCTHUNT_TOKEN bekleniyor, henüz doğrulanmadı
    weight: 1.0

  itchio:
    enabled: true
    weight: 0.7
    # ÖLÇÜM: PROJECT.md'de feed URL'i belirsizdi; çalışan bu.
    feed: "https://itch.io/games/newest.xml"

  steam:
    enabled: true
    weight: 0.6
    # FAZ 2 DÜZELTMESİ: newreleases.xml RSS'i ÖLÜ — en yeni kaydı 49 gün önceye ait,
    # listede 2023 tarihli oyunlar var. Store arama endpoint'i (sort_by=Released_DESC)
    # kullanılıyor; kod içinde sabit, config'de URL tutulmuyor.
    # Çıkış tarihi gün hassasiyetinde geldiği için pencere gün bazında değerlendirilir.

  reddit:
    # KAPALI — Responsible Builder Policy (2026-06 güncellemesi) Reddit verisinin
    # yazılı onay olmadan PAYLAŞILMASINI yasaklıyor; bu proje çıktıyı public bir
    # GitHub Pages sayfasında yayınlıyor ve digest.db'yi public repoya commit ediyor.
    # Ayrıca app oluşturma "explicit approval" gerektiriyor, süreç tıkalı.
    # Kaybı düşük: r/SideProject ≈ Show HN + Product Hunt,
    # r/gamedev + r/IndieDev ≈ 5 Bluesky gamedev feed'i.
    # sources/reddit.py yine yazılacak; onay alınırsa enabled: true yeter.
    enabled: false
    weight: 0.6
    subreddits: [gamedev, IndieDev, SideProject, webdev]
    min_upvotes: 25

  bluesky:
    enabled: true
    weight: 0.8
    # Feed generator'lar çok gürültülü (medyan ♥1-6). "Sinyal > hacim" ilkesi
    # gereği beğeni eşiği. Küratörlü hesap timeline'larına uygulanmaz.
    min_likes_feed: 5
    # ÖLÇÜM: searchPosts artık 403 (anahtarsız kapalı).
    # Çözüm: feed generator URI + getFeed — anahtarsız, test edildi.
    feeds:
      - { name: "Bluesky GameDev",    cat: gamedev, uri: "at://did:plc:3z7fz2uzhy5vt627pasakzxh/app.bsky.feed.generator/aaaojmdjtuco4" }
