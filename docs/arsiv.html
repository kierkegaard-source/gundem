<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gündem — Arşiv</title>
<meta name="description" content="Her sabah developer tools, indie oyun, yeni uygulama ve tasarım dünyasından yeni çıkanlar — Türkçe özetlerle.">
<meta name="color-scheme" content="light dark">
<style>/* Daily Launch — gazete hissi. Harici font yok, JS yok, tek sütun. */

:root {
  --bg:        #fbfaf7;
  --surface:   #ffffff;
  --ink:       #14110d;
  --ink-soft:  #55504a;
  --ink-faint: #8a837a;
  --rule:      #d9d3c8;
  --rule-soft: #e8e3d9;
  --accent:    #8a2b18;
  --warn-bg:   #fdf3e3;
  --warn-ink:  #7a4b12;
  --warn-rule: #e0c48a;

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
           Georgia, "Times New Roman", serif;
  --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
           "Helvetica Neue", Arial, sans-serif;
  --mono:  ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #14130f;
    --surface:   #1b1a16;
    --ink:       #ece7dd;
    --ink-soft:  #b3ada2;
    --ink-faint: #7d776d;
    --rule:      #35322b;
    --rule-soft: #262420;
    --accent:    #e08161;
    --warn-bg:   #2a2114;
    --warn-ink:  #e0b878;
    --warn-rule: #55401d;
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  padding: 0 1.15rem 4rem;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.6;
  overflow-wrap: break-word;
}

.wrap { max-width: 720px; margin: 0 auto; }

/* ---------- başlık ---------- */

.masthead {
  border-bottom: 3px double var(--rule);
  padding: 2.5rem 0 1.1rem;
  margin-bottom: 1.6rem;
  text-align: center;
}

.masthead h1 {
  font-family: var(--serif);
  font-size: clamp(2.1rem, 9vw, 3.1rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
  line-height: 1.05;
}

.masthead h1 a { color: inherit; text-decoration: none; }

.masthead .tagline {
  font-size: 0.76rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-top: 0.55rem;
}

.dateline {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.4rem 1rem;
  margin-top: 1rem;
  font-size: 0.85rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.dateline strong { color: var(--ink); font-weight: 600; }

/* ---------- uyarı bandı ---------- */

.notice {
  background: var(--warn-bg);
  border: 1px solid var(--warn-rule);
  border-left-width: 4px;
  color: var(--warn-ink);
  padding: 0.8rem 1rem;
  margin: 0 0 1.8rem;
  font-size: 0.86rem;
  line-height: 1.5;
}

.notice b { display: block; margin-bottom: 0.25rem; }
.notice ul { margin: 0.4rem 0 0; padding-left: 1.1rem; }
.notice li { margin: 0.15rem 0; }

/* ---------- kategori ---------- */

.section { margin: 2.6rem 0 0; }

.section > h2 {
  font-family: var(--serif);
  font-size: 1.02rem;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 1.25rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
}

.section > h2 .count {
  font-family: var(--sans);
  font-size: 0.72rem;
  font-weight: 400;
  letter-spacing: 0.06em;
  color: var(--ink-faint);
}

/* ---------- madde ---------- */

.item {
  padding: 0 0 1.5rem;
  margin-bottom: 1.5rem;
  border-bottom: 1px solid var(--rule-soft);
}

.section .item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0.4rem; }

.item h3 {
  font-family: var(--serif);
  font-size: 1.26rem;
  line-height: 1.3;
  font-weight: 600;
  margin: 0 0 0.4rem;
}

.item h3 a {
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--rule);
}

.item h3 a:hover { color: var(--accent); border-bottom-color: var(--accent); }

.why {
  font-size: 0.9rem;
  color: var(--accent);
  font-style: italic;
  margin: 0 0 0.5rem;
}

.summary { margin: 0 0 0.7rem; color: var(--ink-soft); }

.meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.74rem;
  color: var(--ink-faint);
}

.badge {
  font-family: var(--mono);
  font-size: 0.68rem;
  letter-spacing: 0.02em;
  border: 1px solid var(--rule);
  border-radius: 2px;
  padding: 0.08rem 0.38rem;
  color: var(--ink-soft);
  white-space: nowrap;
}

.badge.multi { border-color: var(--accent); color: var(--accent); }

.meta time { font-variant-numeric: tabular-nums; }

/* ---------- gezinme ve alt bilgi ---------- */

.pager {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  margin-top: 3rem;
  padding-top: 1.2rem;
  border-top: 3px double var(--rule);
  font-size: 0.88rem;
}

.pager a { color: var(--accent); text-decoration: none; }
.pager a:hover { text-decoration: underline; }
.pager span { color: var(--ink-faint); }

.archive-list { list-style: none; padding: 0; margin: 1.5rem 0 0; }

.archive-list li {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  padding: 0.65rem 0;
  border-bottom: 1px solid var(--rule-soft);
}

.archive-list a { color: var(--ink); text-decoration: none; font-family: var(--serif); font-size: 1.05rem; }
.archive-list a:hover { color: var(--accent); }
.archive-list .count { font-size: 0.78rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

footer {
  margin-top: 3rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--rule);
  font-size: 0.76rem;
  color: var(--ink-faint);
  text-align: center;
  line-height: 1.7;
}

footer a { color: var(--ink-faint); }

.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--ink-faint);
  font-family: var(--serif);
  font-size: 1.1rem;
}

@media (max-width: 480px) {
  body { font-size: 16px; padding: 0 0.9rem 3rem; }
  .masthead { padding-top: 1.8rem; }
  .item h3 { font-size: 1.15rem; }
}
</style>
</head>
