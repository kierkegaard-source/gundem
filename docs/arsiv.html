<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gündem — Arşiv</title>
<meta name="description" content="Her sabah developer tools, indie oyun, yeni uygulama ve tasarım dünyasından yeni çıkanlar — Türkçe özetlerle.">
<meta name="color-scheme" content="light dark">
<style>/* Gündem — gazete hissi, tarama için tasarlandı.
   Harici istek yok (font, ikon, script). Tek dosya, sayfaya gömülü. */

:root {
  --bg:        #faf8f4;
  --surface:   #ffffff;
  --surface-2: #f3efe7;
  --ink:       #17140f;
  --ink-soft:  #4d4740;
  --ink-faint: #8b8479;
  --rule:      #ddd6c8;
  --rule-soft: #ebe5d9;
  --accent:    #9a2f16;
  --accent-2:  #2f5d50;
  --shadow:    0 1px 2px rgba(23,20,15,.05), 0 6px 16px -10px rgba(23,20,15,.18);
  --warn-bg:   #fdf4e3;
  --warn-ink:  #7d4c12;
  --warn-rule: #e3c790;

  /* Kaynak renkleri — marka logosu değil, marka rengiyle monogram rozet.
     Logoları kopyalamak yerine bu tercih edildi: harici istek yok, ticari
     marka sorunu yok, koyu/açık temada okunur, toplam maliyeti ~0 bayt. */
  --s-hackernews: #e8590c;
  --s-producthunt:#d64426;
  --s-github:     #3d4450;
  --s-itchio:     #e04b4b;
  --s-steam:      #2a6f97;
  --s-bluesky:    #1573d8;
  --s-twitter:    #2b2b2b;
  --s-rss:        #c9761b;

  --display: "Iowan Old Style", "Charter", "Bitstream Charter", "Sitka Text",
             Cambria, "Palatino Linotype", Palatino, Georgia, serif;
  --ui: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #121110;
    --surface:   #1a1917;
    --surface-2: #221f1c;
    --ink:       #eeeae2;
    --ink-soft:  #b5aea3;
    --ink-faint: #837c71;
    --rule:      #322e28;
    --rule-soft: #262320;
    --accent:    #e58a68;
    --accent-2:  #79b8a4;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7);
    --warn-bg:   #2b2114;
    --warn-ink:  #e3ba7d;
    --warn-rule: #574119;

    --s-hackernews: #ff8b3d;
    --s-producthunt:#f2765a;
    --s-github:     #9aa4b2;
    --s-itchio:     #ff7b7b;
    --s-steam:      #5fa8d3;
    --s-bluesky:    #4da3ff;
    --s-twitter:    #c8c4bd;
    --s-rss:        #e0a45c;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  padding: 0 1.15rem 4rem;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 16.5px;
  line-height: 1.55;
  overflow-wrap: break-word;
}

.wrap { max-width: 1080px; margin: 0 auto; }
.narrow { max-width: 760px; margin: 0 auto; }

/* ================= başlık ================= */

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 0.75rem 1.5rem;
  padding: 2rem 0 0.9rem;
  border-bottom: 3px double var(--rule);
}

.brand { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; }

.brand h1 {
  font-family: var(--display);
  font-size: clamp(1.9rem, 5.5vw, 2.6rem);
  font-weight: 700;
  letter-spacing: -0.025em;
  margin: 0;
  line-height: 1;
}
.brand h1 a { color: inherit; text-decoration: none; }

.brand .tagline {
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.stats {
  display: flex;
  align-items: baseline;
  gap: 0.9rem;
  font-size: 0.83rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.stats .day { font-weight: 650; color: var(--ink); }
.stats .sep { color: var(--rule); }

/* ================= kategori gezinme ================= */

.catnav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  padding: 0.9rem 0 0;
  margin-bottom: 1.6rem;
}

.catnav a {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.7rem;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 0.82rem;
  text-decoration: none;
  white-space: nowrap;
}
.catnav a:hover { border-color: var(--accent); color: var(--accent); }
.catnav a b { font-weight: 650; color: var(--ink); }
.catnav a i {
  font-style: normal;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-faint);
}

/* ================= uyarı ================= */

.notice {
  background: var(--warn-bg);
  border: 1px solid var(--warn-rule);
  border-left-width: 4px;
  border-radius: 3px;
  color: var(--warn-ink);
  padding: 0.75rem 1rem;
  margin: 0 0 1.8rem;
  font-size: 0.85rem;
}
.notice b { display: block; margin-bottom: 0.2rem; }
.notice ul { margin: 0.35rem 0 0; padding-left: 1.05rem; }

/* ================= bölüm ================= */

.section { margin: 0 0 2.8rem; scroll-margin-top: 1rem; }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  margin: 0 0 1.1rem;
  padding-bottom: 0.45rem;
  border-bottom: 2px solid var(--ink);
}

.section-head h2 {
  font-family: var(--display);
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 0;
}

.section-head .count {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  white-space: nowrap;
}

/* ================= kart ızgarası ================= */

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.9rem;
}

@media (min-width: 860px) {
  .grid { grid-template-columns: 1fr 1fr; gap: 1rem 1.4rem; }
  .card.lead { grid-column: 1 / -1; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--rule-soft);
  border-radius: 5px;
  padding: 0.9rem 1rem 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.card:hover { box-shadow: var(--shadow); border-color: var(--rule); }

.card h3 {
  font-family: var(--display);
  font-size: 1.1rem;
  line-height: 1.28;
  font-weight: 600;
  margin: 0;
}
.card h3 a { color: var(--ink); text-decoration: none; }
.card h3 a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

.card.lead {
  background: var(--surface-2);
  border-color: var(--rule);
  padding: 1.15rem 1.25rem 1.05rem;
}
.card.lead h3 { font-size: 1.45rem; line-height: 1.22; }
.card.lead .body { font-size: 1rem; }

.why {
  font-family: var(--display);
  font-style: italic;
  font-size: 0.95rem;
  line-height: 1.4;
  color: var(--accent);
  margin: 0;
}

.body {
  font-size: 0.9rem;
  line-height: 1.5;
  color: var(--ink-soft);
  margin: 0;
}
/* Özet üretilememişse kaynağın kendi (çoğunlukla İngilizce) açıklaması
   gösterilir. Ayrı bir etiket konmuyor — sayfa üstündeki uyarı bandı zaten
   söylüyor; kart başına tekrarlamak gürültü yapıyordu. Ayrım tipografik:
   daha soluk ve italik. */
.body.raw {
  color: var(--ink-faint);
  font-style: italic;
  border-left: 2px solid var(--rule-soft);
  padding-left: 0.6rem;
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem;
  margin-top: auto;
  padding-top: 0.15rem;
  font-size: 0.74rem;
  color: var(--ink-faint);
}
.card-meta time { font-variant-numeric: tabular-nums; }
.card-meta .dot { color: var(--rule); }

/* ---- kaynak rozeti ---- */

.src {
  display: inline-flex;
  align-items: center;
  gap: 0.32rem;
  font-size: 0.72rem;
  color: var(--ink-soft);
  white-space: nowrap;
}

.src .mark {
  display: inline-grid;
  place-items: center;
  width: 1.05rem;
  height: 1.05rem;
  border-radius: 3px;
  background: var(--c, var(--ink-faint));
  color: #fff;
  font-family: var(--mono);
  font-size: 0.56rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
@media (prefers-color-scheme: dark) { .src .mark { color: #14120f; } }

.src-hackernews  { --c: var(--s-hackernews); }
.src-producthunt { --c: var(--s-producthunt); }
.src-github_trending { --c: var(--s-github); }
.src-itchio      { --c: var(--s-itchio); }
.src-steam       { --c: var(--s-steam); }
.src-bluesky     { --c: var(--s-bluesky); }
.src-twitter     { --c: var(--s-twitter); }
.src-rss         { --c: var(--s-rss); }

.multi-flag {
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent-2);
  border: 1px solid var(--accent-2);
  border-radius: 2px;
  padding: 0 0.25rem;
}

/* ================= gezinme, arşiv, alt bilgi ================= */

.pager {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  margin-top: 2.5rem;
  padding-top: 1.1rem;
  border-top: 3px double var(--rule);
  font-size: 0.88rem;
}
.pager a { color: var(--accent); text-decoration: none; }
.pager a:hover { text-decoration: underline; }
.pager span { color: var(--ink-faint); }

.archive-list { list-style: none; padding: 0; margin: 1.2rem 0 0; }
.archive-list li {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--rule-soft);
}
.archive-list a {
  color: var(--ink);
  text-decoration: none;
  font-family: var(--display);
  font-size: 1.05rem;
}
.archive-list a:hover { color: var(--accent); }
.archive-list .count {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

footer {
  margin-top: 2.5rem;
  padding-top: 1.1rem;
  border-top: 1px solid var(--rule);
  font-size: 0.75rem;
  color: var(--ink-faint);
  text-align: center;
  line-height: 1.8;
}
footer a { color: var(--ink-faint); }

.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--ink-faint);
  font-family: var(--display);
  font-size: 1.1rem;
}

@media (max-width: 520px) {
  body { font-size: 16px; padding: 0 0.85rem 3rem; }
  .masthead { padding-top: 1.4rem; }
  .card { padding: 0.8rem 0.85rem; }
  .card.lead { padding: 0.95rem 0.9rem; }
  .card.lead h3 { font-size: 1.25rem; }
}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <div class="brand">
    <h1><a href="index.html">Gündem</a></h1>
    <span class="tagline">Ürün &amp; Girişim Gazetesi</span>
  </div>
<div class="stats"><span class="day">Arşiv</span><span class="sep">|</span><span>1 sayı</span></div>
</header>

<div class="narrow">
<section class="section">
  <div class="section-head">
    <h2>Tüm sayılar</h2>
    <span class="count">1 gün</span>
  </div>
  <ul class="archive-list">
    <li><a href="2026-08-30.html">Pazar, 30 Ağustos 2026</a><span class="count">60 madde</span></li>
  </ul>
</section>
</div>

<footer>
  <a href="index.html">Bugünkü sayı</a> · <a href="arsiv.html">Arşiv</a><br>

</footer>

</div>
</body>
</html>
