<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gündem — Arşiv</title>
<meta name="description" content="Her sabah developer tools, indie oyun, yeni uygulama ve tasarım dünyasından yeni çıkanlar — Türkçe özetlerle.">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="https://kierkegaard-source.github.io/gundem/arsiv.html">
<style>/* Gündem — gazete hissi, tarama için tasarlandı.
   Harici istek yok (font, ikon, script). Tek dosya, sayfaya gömülü. */

:root {
  --bg:        #f4f5f3;
  --surface:   #ffffff;
  --surface-2: #eceeeb;
  --ink:       #0f1417;
  --ink-soft:  #414b52;
  --ink-faint: #79858d;
  --rule:      #cfd5d6;
  --rule-soft: #e3e7e6;
  --accent:    #0a6b5c;
  --accent-2:  #a8420f;
  --shadow:    0 1px 2px rgba(15,20,23,.05), 0 8px 20px -12px rgba(15,20,23,.22);
  --radar-bg:   #eef7f4;
  --radar-rule: #b9d9d1;
  --radar-ink:  #0a6b5c;
  --radar-soft: #48645e;

  --warn-bg:   #fdf5e6;
  --warn-ink:  #7a4c14;
  --warn-rule: #e0c795;

  /* Kaynak renkleri — marka logosu değil, marka rengiyle monogram rozet.
     Logoları kopyalamak yerine bu tercih edildi: harici istek yok, ticari
     marka sorunu yok, koyu/açık temada okunur, toplam maliyeti ~0 bayt. */
  --s-hackernews: #e8590c;
  --s-producthunt:#d64426;
  --s-github:     #3d4450;
  --s-itchio:     #e04b4b;
  --s-steam:      #2a6f97;
  --s-bluesky:    #1573d8;
  --s-twitter:    #2b2b2b;
  --s-rss:        #c9761b;

  /* Rol değişimi: başlıklar sıkı puntolu sans (modern editoryal),
     okunan gövde metni serif. Öncekinin tersi — daha keskin bir kontrast. */
  --display: system-ui, -apple-system, "Segoe UI Variable Display", "Segoe UI",
             "Helvetica Neue", Inter, Roboto, Arial, sans-serif;
  --read: "Iowan Old Style", Charter, "Bitstream Charter", "Sitka Text",
          Cambria, "Palatino Linotype", Palatino, Georgia, serif;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0d1114;
    --surface:   #141a1e;
    --surface-2: #1b2328;
    --ink:       #e8edef;
    --ink-soft:  #a7b3ba;
    --ink-faint: #71808a;
    --rule:      #26313a;
    --rule-soft: #1d262c;
    --accent:    #3fbfa8;
    --accent-2:  #e08a55;
    --shadow:    0 1px 2px rgba(0,0,0,.5), 0 10px 24px -14px rgba(0,0,0,.85);
    --radar-bg:   #10231f;
    --radar-rule: #235047;
    --radar-ink:  #48d3b8;
    --radar-soft: #94b3ac;

    --warn-bg:   #2b2114;
    --warn-ink:  #e3ba7d;
    --warn-rule: #574119;

    --s-hackernews: #ff8b3d;
    --s-producthunt:#f2765a;
    --s-github:     #9aa4b2;
    --s-itchio:     #ff7b7b;
    --s-steam:      #5fa8d3;
    --s-bluesky:    #4da3ff;
    --s-twitter:    #c8c4bd;
    --s-rss:        #e0a45c;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  padding: 0 1.15rem 4rem;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 16.5px;
  line-height: 1.55;
  overflow-wrap: break-word;
}

.wrap { max-width: 1080px; margin: 0 auto; }
.narrow { max-width: 760px; margin: 0 auto; }

/* ================= başlık ================= */

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 0.75rem 1.5rem;
  padding: 2rem 0 0.9rem;
  border-bottom: 3px double var(--rule);
}

.brand { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; }

.brand h1 {
  font-family: var(--display);
  font-size: clamp(1.85rem, 5.5vw, 2.5rem);
  font-weight: 800;
  letter-spacing: -0.045em;
  margin: 0;
  line-height: 1;
}
.brand h1 a { color: inherit; text-decoration: none; }

.brand .tagline {
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-faint);
}

.stats {
  display: flex;
  align-items: baseline;
  gap: 0.9rem;
  font-size: 0.83rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.stats .day { font-weight: 650; color: var(--ink); }
.stats .sep { color: var(--rule); }
.stats .stamp {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-faint);
  cursor: help;
}

/* ================= görünüm seçici ================= */

.viewnav {
  display: inline-flex;
  gap: 1px;
  margin: 0.95rem 0 0;
  padding: 2px;
  background: var(--surface-2);
  border: 1px solid var(--rule);
  border-radius: 999px;
}

.viewnav a {
  padding: 0.28rem 0.85rem;
  border-radius: 999px;
  font-size: 0.79rem;
  font-weight: 550;
  color: var(--ink-soft);
  text-decoration: none;
  white-space: nowrap;
}
.viewnav a:hover { color: var(--accent); }
.viewnav a.on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}

/* ================= kategori gezinme ================= */

.catnav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  padding: 0.75rem 0 0;
  margin-bottom: 1.6rem;
}

.catnav a {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.7rem;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 0.82rem;
  text-decoration: none;
  white-space: nowrap;
}
.catnav a:hover { border-color: var(--accent); color: var(--accent); }
.catnav a b { font-weight: 650; color: var(--ink); }
.catnav a i {
  font-style: normal;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-faint);
}

/* ================= radar (kısa vadeli potansiyel) ================= */

.radar {
  background: var(--radar-bg);
  border: 1px solid var(--radar-rule);
  border-left: 4px solid var(--radar-ink);
  border-radius: 5px;
  padding: 0.95rem 1.1rem 1rem;
  margin: 0 0 1.8rem;
}

.radar-head {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  margin-bottom: 0.7rem;
  flex-wrap: wrap;
}

.radar-icon {
  display: inline-grid;
  place-items: center;
  width: 1.25rem;
  height: 1.25rem;
  border-radius: 50%;
  background: var(--radar-ink);
  color: var(--radar-bg);
  font-family: var(--mono);
  font-size: 0.8rem;
  font-weight: 700;
  line-height: 1;
}

.radar-head h2 {
  font-family: var(--display);
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--radar-ink);
  margin: 0;
}

.radar-sub { font-size: 0.78rem; color: var(--radar-soft); }

.radar-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.55rem; }
@media (min-width: 860px) { .radar-list { grid-template-columns: 1fr 1fr; gap: 0.55rem 1.4rem; } }

.radar-list li { display: flex; gap: 0.6rem; align-items: flex-start; }

.radar-score {
  flex: none;
  min-width: 2.1rem;
  text-align: center;
  font-family: var(--mono);
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--radar-ink);
  border: 1px solid var(--radar-rule);
  border-radius: 3px;
  padding: 0.1rem 0.15rem;
  line-height: 1.25;
}
.radar-score i { font-style: normal; font-size: 0.6rem; opacity: 0.65; }

.radar-body { min-width: 0; }
.radar-body a {
  font-family: var(--display);
  font-size: 0.97rem;
  font-weight: 650;
  letter-spacing: -0.015em;
  line-height: 1.28;
  color: var(--ink);
  text-decoration: none;
}
.radar-body a:hover { color: var(--radar-ink); text-decoration: underline; }
.radar-body p { margin: 0.15rem 0 0.3rem; font-family: var(--read);
  font-size: 0.87rem; line-height: 1.45; color: var(--radar-soft); }
.radar-meta { display: flex; flex-wrap: wrap; gap: 0.35rem; }

.opp {
  display: inline-block;
  margin-left: 0.4rem;
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--radar-ink);
  border: 1px solid var(--radar-rule);
  border-radius: 2px;
  padding: 0.05rem 0.3rem;
  vertical-align: 0.12em;
  white-space: nowrap;
}

.radar-foot {
  margin: 0.8rem 0 0;
  padding-top: 0.6rem;
  border-top: 1px solid var(--radar-rule);
  font-size: 0.72rem;
  line-height: 1.45;
  color: var(--radar-soft);
}

/* Önemsiz aksaklıklar sayfanın ALTINDA, tek satır, sessiz. Üstteki bant
   yalnızca ciddi durumlar için: özetleme hiç yapılamadı ya da bir kaynağın
   tamamı düştü. */
.minor-notice {
  margin: 2rem 0 0;
  font-size: 0.74rem;
  line-height: 1.5;
  color: var(--ink-faint);
  font-family: var(--mono);
}

.radar-empty {
  margin: 0 0 1.6rem;
  padding: 0.6rem 0.85rem;
  border: 1px dashed var(--rule);
  border-radius: 4px;
  font-size: 0.82rem;
  color: var(--ink-faint);
}

/* ================= uyarı ================= */

.notice {
  background: var(--warn-bg);
  border: 1px solid var(--warn-rule);
  border-left-width: 4px;
  border-radius: 3px;
  color: var(--warn-ink);
  padding: 0.75rem 1rem;
  margin: 0 0 1.8rem;
  font-size: 0.85rem;
}
.notice b { display: block; margin-bottom: 0.2rem; }
.notice ul { margin: 0.35rem 0 0; padding-left: 1.05rem; }

/* ================= bölüm ================= */

.section { margin: 0 0 2.8rem; scroll-margin-top: 1rem; }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
  margin: 0 0 1.1rem;
  padding-bottom: 0.4rem;
  border-bottom: 1.5px solid var(--accent);
}

.section-head h2 .src { vertical-align: -0.15em; margin-right: 0.15rem; }
.section-head h2 .mark { width: 1.15rem; height: 1.15rem; font-size: 0.6rem; }
.catnav .src { margin-right: -0.1rem; }
.catnav .mark { width: 0.95rem; height: 0.95rem; font-size: 0.52rem; }

.section-head h2 {
  font-family: var(--display);
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0;
}

.section-head .count {
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  color: var(--ink-faint);
  white-space: nowrap;
}

/* ================= kart ızgarası ================= */

.grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.9rem;
}

@media (min-width: 860px) {
  .grid { grid-template-columns: 1fr 1fr; gap: 1rem 1.4rem; }
  .card.lead { grid-column: 1 / -1; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--rule-soft);
  border-radius: 5px;
  padding: 0.9rem 1rem 0.85rem;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.card:hover { box-shadow: var(--shadow); border-color: var(--rule); }

.card h3 {
  font-family: var(--display);
  font-size: 1.06rem;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: -0.017em;
  margin: 0;
}
.card h3 a { color: var(--ink); text-decoration: none; }
.card h3 a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

.card.lead {
  background: var(--surface-2);
  border-color: var(--rule);
  padding: 1.15rem 1.25rem 1.05rem;
}
.card.lead h3 { font-size: 1.5rem; line-height: 1.2; letter-spacing: -0.028em; }
.card.lead .body { font-size: 1rem; }

.why {
  font-family: var(--read);
  font-style: italic;
  font-size: 0.95rem;
  line-height: 1.4;
  color: var(--accent);
  margin: 0;
}

.body {
  font-family: var(--read);
  font-size: 0.94rem;
  line-height: 1.55;
  color: var(--ink-soft);
  margin: 0;
}
/* Özet üretilememişse kaynağın kendi (çoğunlukla İngilizce) açıklaması
   gösterilir. Ayrı bir etiket konmuyor — sayfa üstündeki uyarı bandı zaten
   söylüyor; kart başına tekrarlamak gürültü yapıyordu. Ayrım tipografik:
   daha soluk ve italik. */
/* Makine çevirisi ya da kaynağın kendi açıklaması — editoryal özet değil.
   Ayrım tipografik: soluk renk ve sol çizgi. */
.body.raw {
  color: var(--ink-soft);
  border-left: 2px solid var(--rule);
  padding-left: 0.65rem;
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem;
  margin-top: auto;
  padding-top: 0.15rem;
  font-size: 0.74rem;
  color: var(--ink-faint);
}
.card-meta time { font-variant-numeric: tabular-nums; }
.card-meta .dot { color: var(--rule); }

/* ---- kaynak rozeti ---- */

.src {
  display: inline-flex;
  align-items: center;
  gap: 0.32rem;
  font-size: 0.72rem;
  color: var(--ink-soft);
  white-space: nowrap;
}

.src .mark {
  display: inline-grid;
  place-items: center;
  width: 1.05rem;
  height: 1.05rem;
  border-radius: 3px;
  background: var(--c, var(--ink-faint));
  color: #fff;
  font-family: var(--mono);
  font-size: 0.56rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
@media (prefers-color-scheme: dark) { .src .mark { color: #14120f; } }

.src-hackernews  { --c: var(--s-hackernews); }
.src-producthunt { --c: var(--s-producthunt); }
.src-github_trending { --c: var(--s-github); }
.src-itchio      { --c: var(--s-itchio); }
.src-steam       { --c: var(--s-steam); }
.src-bluesky     { --c: var(--s-bluesky); }
.src-twitter     { --c: var(--s-twitter); }
.src-rss         { --c: var(--s-rss); }

.opp-mini {
  font-family: var(--mono);
  font-size: 0.63rem;
  letter-spacing: 0.04em;
  color: var(--radar-ink);
  border: 1px solid var(--radar-rule);
  background: var(--radar-bg);
  border-radius: 2px;
  padding: 0 0.28rem;
  white-space: nowrap;
}

.multi-flag {
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent-2);
  border: 1px solid var(--accent-2);
  border-radius: 2px;
  padding: 0 0.25rem;
}

/* ================= gezinme, arşiv, alt bilgi ================= */

.pager {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  margin-top: 2.5rem;
  padding-top: 1.1rem;
  border-top: 3px double var(--rule);
  font-size: 0.88rem;
}
.pager a { color: var(--accent); text-decoration: none; }
.pager a:hover { text-decoration: underline; }
.pager span { color: var(--ink-faint); }

.archive-list { list-style: none; padding: 0; margin: 1.2rem 0 0; }
.archive-list li {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--rule-soft);
}
.archive-list a {
  color: var(--ink);
  text-decoration: none;
  font-family: var(--display);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -0.015em;
}
.archive-list a:hover { color: var(--accent); }
.archive-list .count {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--ink-faint);
}

footer {
  margin-top: 2.5rem;
  padding-top: 1.1rem;
  border-top: 1px solid var(--rule);
  font-size: 0.75rem;
  color: var(--ink-faint);
  text-align: center;
  line-height: 1.8;
}
footer a { color: var(--ink-faint); }

.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--ink-faint);
  font-family: var(--read);
  font-size: 1.1rem;
}

@media (max-width: 520px) {
  body { font-size: 16px; padding: 0 0.85rem 3rem; }
  .masthead { padding-top: 1.4rem; }
  .card { padding: 0.8rem 0.85rem; }
  .card.lead { padding: 0.95rem 0.9rem; }
  .card.lead h3 { font-size: 1.25rem; }
}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <div class="brand">
    <h1><a href="./">Gündem</a></h1>
    <span class="tagline">Ürün &amp; Girişim Gazetesi</span>
  </div>
<div class="stats"><span class="day">Arşiv</span><span class="sep">|</span><span>2 sayı</span></div>
</header>

<section class="section">
